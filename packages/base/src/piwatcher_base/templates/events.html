{% extends "base.html" %}
{% block title %}Events{% endblock %}

{% block content %}
<section class="space-y-6">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <p class="text-sm uppercase tracking-wide text-emerald-300">Recent motion</p>
            <h1 class="text-3xl font-semibold text-white">Events</h1>
        </div>
        <p class="text-sm text-gray-400">Auto-refreshes every 10 seconds.</p>
    </div>

    <div
        id="event-grid"
        class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
        hx-get="/events/partials{% if selected_camera_id %}?camera_id={{ selected_camera_id }}{% endif %}"
        hx-trigger="every 10s"
        hx-swap="innerHTML"
    >
        {% for event in events %}
        {% include "partials/event_card.html" %}
        {% else %}
        <div class="col-span-full rounded-lg border border-gray-800 bg-gray-900 p-8 text-center text-gray-400">No events yet.</div>
        {% endfor %}
    </div>
</section>
{% endblock %}
