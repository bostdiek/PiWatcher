[project]
name = "piwatcher-camera"
version = "0.1.0"
description = "PiWatcher camera motion detection and capture"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
