[project]
name = "piwatcher"
version = "0.1.0"
description = "Wildlife camera system with Pi Zero W cameras and Pi 5 AI inference"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "piwatcher-camera",
    "piwatcher-base",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
piwatcher-camera = { workspace = true }
piwatcher-base = { workspace = true }

[tool.uv]
dev-dependencies = [
    "ruff>=0.11",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]